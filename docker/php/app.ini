; Pengaturan PHP khusus container (host tidak tersentuh)
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
date.timezone = Asia/Jakarta

; Image php:7.4-apache tidak punya php.ini aktif, jadi session.save_path kosong.
; Tanpa ini CI3 gagal: mkdir(): Invalid path di Session_files_driver.
session.save_path = /tmp
session.gc_probability = 0
