name: laboratorium

services:
  web:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # development = error PHP tampil (memudahkan debug), ganti ke production kalau sudah stabil
      CI_ENV: development
      DB_HOST: db
      DB_NAME: ${DB_NAME:-laboratorium}
      DB_USER: ${DB_USER:-lab}
      DB_PASS: ${DB_PASS:-lab}
      CI_BASE_URL: http://localhost:${WEB_PORT:-8080}/
    volumes:
      - ./:/var/www/html
      - ./docker/php/app.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: ${DB_IMAGE:-mariadb:10.6}
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-laboratorium}
      MARIADB_USER: ${DB_USER:-lab}
      MARIADB_PASSWORD: ${DB_PASS:-lab}
    ports:
      # hanya untuk akses GUI client dari host (mis. DBeaver), tidak dipakai aplikasi
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/zz-app.cnf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  dbdata:
